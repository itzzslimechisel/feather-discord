[package]
name = "feather-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Discord connectivity, storage and settings for Feather (no UI dependencies)"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "multipart", "http2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
dirs = "6"
zeroize = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fastrand = "2"
url = "2"

[target.'cfg(not(target_os = "windows"))'.dependencies]
notify-rust = { version = "4", default-features = false, features = ["z"] }

[target.'cfg(target_os = "windows")'.dependencies]
notify-rust = { version = "4" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "rt-multi-thread", "test-util"] }
tempfile = "3"
